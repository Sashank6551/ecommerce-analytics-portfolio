version: 2

models:
  - name: fct_rfm_segments
    description: |
      Customer segmentation based on RFM (Recency, Frequency, Monetary) analysis.
      Each customer is scored 1-5 on three dimensions and assigned to behavioral segments
      for targeted marketing and retention strategies.
      
      Refresh: Daily recommended to track segment transitions
      
    columns:
      - name: user_id
        description: Unique customer identifier (user ID from source system)
        tests:
          - unique
          - not_null
          
      - name: customer_name
        description: Customer full name
        
      - name: customer_email
        description: Customer email address
        
      - name: country
        description: Customer country
        
      - name: city
        description: Customer city
        
      - name: recency_days
        description: Number of days since last order (lower = more recent)
        
      - name: frequency_count
        description: Total number of completed orders
        tests:
          - not_null
          
      - name: monetary_value
        description: Total revenue generated by customer (sum of all orders)
        tests:
          - not_null
          
      - name: avg_order_value
        description: Average order value (AOV) for the customer
        
      - name: recency_score
        description: |
          Quintile score for recency (1-5)
          5 = Most recent purchases (top 20%)
          1 = Least recent purchases (bottom 20%)
          
      - name: frequency_score
        description: |
          Quintile score for frequency (1-5)
          5 = Most frequent buyers (top 20%)
          1 = Least frequent buyers (bottom 20%)
          
      - name: monetary_score
        description: |
          Quintile score for monetary value (1-5)
          5 = Highest spenders (top 20%)
          1 = Lowest spenders (bottom 20%)
          
      - name: rfm_code
        description: |
          Concatenated RFM score (e.g., '555', '432')
          Format: [R][F][M]
          
      - name: customer_segment
        description: |
          Behavioral segment based on RFM scores:
          - Champions: Best customers (R≥4, F≥4, M≥4)
          - Loyal Customers: Regular high-value (R≥3, F≥4, M≥3)
          - Potential Loyalists: Recent with growth potential (R≥4, F≤3)
          - At Risk: Good customers declining (R≤2, F≥3, M≥3)
          - Can't Lose Them: Top spenders gone cold (R=1, F≥4, M≥4)
          - Hibernating: Low activity (R≤2, F≤2, M≤2)
          - Lost: Completely churned (R=1, F≤2, M≤2)
          - New Customers: Recent first-timers (R≥4, F=1)
          - Promising: Moderate engagement (R≥3, F≥2, M≥2)
          - Need Attention: Others requiring strategy
        tests:
          - not_null
          - accepted_values:
              values: ['Champions', "Loyal Customers", "Potential Loyalists", 
                       "At Risk", 'Hibernating',"New Customers", 'Promising', "Need Attention"]
          
      - name: action_priority
        description: |
          Priority ranking for retention action (1 = highest)
          1 = Can't Lose Them (urgent)
          2 = At Risk (important)
          3 = Champions (maintain)
          4 = Potential Loyalists (nurture)
          5 = Loyal Customers (reward)
          6 = Others (standard engagement)
          
      - name: first_order_date
        description: Date of customer's first order
        
      - name: last_order_date
        description: Date of customer's most recent order
        
      - name: customer_lifetime_days
        description: Days between first and last order (customer tenure)
        
      - name: snapshot_date
        description: Analysis date (typically most recent order date in dataset)
        
      - name: dbt_updated_at
        description: Timestamp when this record was created/updated by dbt